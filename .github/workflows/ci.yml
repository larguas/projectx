name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: make check (Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: emg
          POSTGRES_USER: emg
          POSTGRES_PASSWORD: emg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emg -d emg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://emg:emg@localhost:5432/emg
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: make install
      - name: Check (lint, format, django check, openapi, tests)
        run: make check
