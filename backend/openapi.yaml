  /api/v1/workouts/{id}/exercises/:
    put:
      operationId: workouts_exercises_replace
      description: |-
        Remplacement ordonné des exercices d'un plan (``PUT .../exercises/``).

        Le corps de la demande est ``{"exercises": [...]}`` : liste COMPLÈTE des
        lignes dans l'ordre souhaité (doublons refusés en validation, visibilité
        de chaque exercice contrôlée en service). La réponse renvoie les lignes
        réindexées 1..N.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - workouts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceWorkoutExercisesRequest'
