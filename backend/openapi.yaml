          title: Sport principal
          maxLength: 100
        notes:
          type: string
      required:
      - date_of_birth
    AthleteReference:
      type: object
      description: Référence compacte d'un profil sportif (``id`` + ``sport``).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sport:
          type: string
          readOnly: true
          title: Sport principal
      required:
      - id
      - sport
    BlankEnum:
      enum:
      - ''
    Calibration:
      type: object
      description: |-
        Calibration (lecture) ; ``applicable`` est calculé pour le moment courant.

        Rattachée à une version PRÉCISE d'un setup : les références ``setup`` et
        ``setup_channel`` sont compactes (le lecteur a déjà accès au setup lui-même
        — même règle d'accès, scope ``setups:read`` sur le profil rattaché).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        athlete:
          allOf:
          - $ref: '#/components/schemas/SetupsAthleteReference'
          readOnly: true
        setup:
          allOf:
          - $ref: '#/components/schemas/SetupReference'
          readOnly: true
        setup_channel:
          allOf:
          - $ref: '#/components/schemas/SetupChannelReference'
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/CalibrationTypeEnum'
          readOnly: true
        values:
          readOnly: true
          title: Valeurs
          description: 'JSON : mvc_rms, fenêtre, paramètres utilisés (ex. {"mvc_rms":
            42.5}).'
        algorithm_version:
          type: string
          readOnly: true
          title: Version d'algorithme
        valid_from:
          type: string
          format: date-time
          readOnly: true
          title: Valide depuis
        valid_until:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Valide jusqu'à
        invalidated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Invalidée le
        invalidation_reason:
          type: string
          readOnly: true
          title: Motif d'invalidation
        applicable:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - algorithm_version
      - applicable
      - athlete
      - created_at
      - id
      - invalidated_at
      - invalidation_reason
      - setup
      - setup_channel
      - type
      - updated_at
      - valid_from
      - valid_until
      - values
    CalibrationTypeEnum:
