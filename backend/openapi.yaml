              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès refusé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ressource introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
