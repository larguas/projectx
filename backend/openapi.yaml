        * `import` - Import
    SuggestedSetup:
      type: object
      description: |-
        Réponse de ``GET /athletes/{id}/sessions/suggested-setup/``.

        ``setup`` est la référence compacte du placement de la DERNIÈRE séance du
        sportif (proposition « même placement que la dernière fois ? ») — ou
        ``null`` si le sportif n'a pas encore de séance, ou si sa dernière séance a
        été créée sans setup (rien à proposer).
      properties:
        setup:
          allOf:
          - $ref: '#/components/schemas/SessionsSetupReference'
          nullable: true
      required:
      - setup
    Team:
      type: object
      description: Équipe (vue par ses membres).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nom
          maxLength: 200
        owner_id:
          type: string
          format: uuid
          title: Propriétaire
          readOnly: true
        owner_email:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - owner_email
      - owner_id
      - updated_at
    TeamMembership:
      type: object
      description: Membre d'une équipe (l'email est visible par les co-équipiers).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          title: Membre
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/TeamMembershipRoleEnum'
          readOnly: true
          title: Rôle
        status:
          allOf:
          - $ref: '#/components/schemas/TeamMembershipStatusEnum'
          readOnly: true
          title: Statut
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - role
      - status
      - user_id
    TeamMembershipRoleEnum:
      enum:
      - owner
      - coach
      - athlete
      type: string
      description: |-
        * `owner` - Propriétaire
        * `coach` - Coach
        * `athlete` - Sportif
    TeamMembershipStatusEnum:
      enum:
      - pending
      - active
      - removed
      type: string
      description: |-
        * `pending` - En attente
        * `active` - Actif
        * `removed` - Retiré
    TeamRequest:
      type: object
      description: Équipe (vue par ses membres).
      properties:
        name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 200
      required:
      - name
    TokenPair:
      type: object
      description: Paire JWT (access + refresh).
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      description: Profil utilisateur (GET/PATCH ``/users/me/``).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Adresse email
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        is_active:
          type: boolean
          readOnly: true
          title: Actif
          description: Les comptes inactifs ne peuvent pas se connecter ni créer de
            compte.
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Date d'inscription
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Email vérifié le
        locale:
          type: string
          maxLength: 35
        timezone:
          type: string
          title: Fuseau horaire (IANA)
          maxLength: 60
      required:
      - date_joined
      - email
      - email_verified_at
      - id
      - is_active
    Workout:
      type: object
      description: Plan d'entraînement (lecture) ; ``editable`` est calculé pour le
        courant.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nom
          maxLength: 200
        athlete:
          allOf:
          - $ref: '#/components/schemas/AthleteReference'
          readOnly: true
        notes:
          type: string
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutExercise'
          readOnly: true
        editable:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - athlete
      - created_at
      - editable
      - exercises
      - id
      - name
      - updated_at
    WorkoutExercise:
      type: object
      description: 'Ligne d''un plan (lecture) : exercice en référence compacte.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        exercise:
          allOf:
          - $ref: '#/components/schemas/ExerciseReference'
          readOnly: true
        order:
          type: integer
          readOnly: true
          title: Ordre
          description: Position 1-based dans le plan.
        target_sets:
          type: integer
          readOnly: true
          title: Séries cibles
        target_reps:
          type: integer
          readOnly: true
          title: Reps cibles
        parameters:
          readOnly: true
          title: Paramètres
          description: 'JSON : tempo, repos, notes par exercice… (ex. {"tempo": "3-1-2"}).'
      required:
      - exercise
      - id
      - order
      - parameters
      - target_reps
      - target_sets
    WorkoutExerciseInputRequest:
      type: object
      description: |-
        Une entrée de la liste ordonnée du remplacement d'exercices.

        ``exercise`` est une pk UUID ; la visibilité de l'exercice pour le
        demandeur (global ou personnel du demandeur) est contrôlée en service —
        référencer un exercice invisible serait une fuite de son existence via
        les lignes du plan.
      properties:
        exercise:
          type: string
          format: uuid
        target_sets:
          type: integer
          minimum: 1
        target_reps:
          type: integer
          minimum: 1
        parameters: {}
      required:
      - exercise
      - target_reps
      - target_sets
    WorkoutRequest:
      type: object
      description: Plan d'entraînement (lecture) ; ``editable`` est calculé pour le
        courant.
      properties:
        name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 200
        notes:
          type: string
      required:
      - name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
