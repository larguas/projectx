openapi: 3.0.3
info:
  title: API Plateforme EMG
  version: 1.0.0
  description: API de la plateforme de suivi musculaire et de performance sportive.
paths:
  /api/v1/auth/clients/:
    get:
      operationId: auth_clients_list
      description: Clients autorisés (module PC / mobile) de l'utilisateur connecté.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceAuthorizationList'
          description: ''
        '400':
          description: Erreur de validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentification requise ou jeton invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès refusé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ressource introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflit avec l'état actuel de la ressource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/clients/{authorization_id}/:
    delete:
      operationId: auth_clients_revoke
      description: 'Révocation d''un client (statut → ``denied``) : plus de refresh
        possible.'
      parameters:
      - in: path
        name: authorization_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Erreur de validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
