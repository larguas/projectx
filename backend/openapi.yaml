components:
  schemas:
    CheckStatus:
      type: object
      properties:
        app:
          $ref: '#/components/schemas/HealthCheckState'
        database:
          $ref: '#/components/schemas/HealthCheckState'
        redis:
          $ref: '#/components/schemas/HealthCheckState'
      required:
      - app
      - database
      - redis
    ClientTypeEnum:
      enum:
      - pc_agent
      - mobile
      type: string
      description: |-
        * `pc_agent` - Module PC
        * `mobile` - Mobile
    DeviceApproveRequest:
      type: object
      description: Approbation / refus d'une autorisation par l'utilisateur connecté.
      properties:
        user_code:
          type: string
          minLength: 1
          maxLength: 16
        approve:
          type: boolean
      required:
      - approve
      - user_code
    DeviceApproveResponse:
      type: object
      description: Nouvel état de l'autorisation après approbation / refus.
      properties:
        status:
          $ref: '#/components/schemas/DeviceApproveResponseStatusEnum'
      required:
      - status
    DeviceApproveResponseStatusEnum:
      enum:
      - approved
      - denied
      type: string
      description: |-
        * `approved` - approved
        * `denied` - denied
    DeviceAuthorization:
      type: object
      description: Client autorisé (module PC / mobile), pour la liste et la révocation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client_type:
          allOf:
          - $ref: '#/components/schemas/ClientTypeEnum'
          readOnly: true
          title: Type de client
        client_name:
          type: string
          readOnly: true
          title: Nom du client
        client_version:
          type: string
          readOnly: true
          title: Version du client
        status:
          allOf:
          - $ref: '#/components/schemas/DeviceAuthorizationStatusEnum'
          readOnly: true
          title: Statut
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          title: Expire le
        last_polled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Dernier polling
      required:
      - client_name
      - client_type
      - client_version
      - created_at
      - expires_at
      - id
      - last_polled_at
      - status
    DeviceAuthorizationStatusEnum:
      enum:
      - pending
      - approved
      - denied
      - expired
      - consumed
      type: string
      description: |-
        * `pending` - En attente d'approbation
        * `approved` - Approuvé
        * `denied` - Refusé ou révoqué
        * `expired` - Expiré
        * `consumed` - Échangé contre des jetons
    DeviceCodeRequestRequest:
      type: object
      description: Demande d'un code d'autorisation pour un client de bureau / mobile.
      properties:
        client_type:
          $ref: '#/components/schemas/ClientTypeEnum'
        client_name:
          type: string
          maxLength: 200
        client_version:
          type: string
          maxLength: 50
      required:
      - client_type
    DeviceCodeResponse:
      type: object
      description: 'Codes d''autorisation : ``device_code`` n''est renvoyé qu''une
        seule fois.'
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_uri:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
      required:
      - device_code
      - expires_in
      - interval
      - user_code
      - verification_uri
    DeviceTokenRequestRequest:
      type: object
      description: Demande de jetons du client (polling avec le ``device_code``).
      properties:
        device_code:
          type: string
          minLength: 1
      required:
      - device_code
    EmailResendRequest:
      type: object
      description: Renvoi de l'email de vérification (throttlé).
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    EmailVerifyRequest:
      type: object
      description: Vérification d'email avec le jeton signé reçu par email.
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
    ErrorPayload:
      type: object
      properties:
        code:
          type: string
          description: Code d'erreur stable, machine-readable.
        message:
          type: string
        details:
          nullable: true
          description: Détails (ex. erreurs par champ) ; null sinon.
      required:
      - code
      - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorPayload'
      required:
      - error
    HealthCheckState:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    HealthResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthResponseStatusEnum'
        checks:
          $ref: '#/components/schemas/CheckStatus'
      required:
      - checks
      - status
    HealthResponseStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    LoginRequest:
      type: object
      description: 'Connexion par email (``USERNAME_FIELD``) : renvoie la paire access
        + refresh.'
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LogoutRequest:
      type: object
      description: 'Déconnexion : blacklist du refresh token transmis.'
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    MessageResponse:
      type: object
      description: Réponse générique à un seul message (ne révèle jamais l'existence
        d'un compte).
      properties:
        message:
          type: string
      required:
      - message
    PaginatedDeviceAuthorizationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAuthorization'
    PasswordChangeRequest:
      type: object
      description: Changement de mot de passe (utilisateur authentifié).
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - new_password
      - old_password
    PasswordForgotRequest:
      type: object
      description: 'Demande de réinitialisation : ne révèle jamais l''existence du
        compte.'
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PasswordResetRequest:
      type: object
      description: Réinitialisation avec le jeton signé reçu par email (usage unique).
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - new_password
      - token
      - uid
    PatchedUserRequest:
      type: object
      description: Profil utilisateur (GET/PATCH ``/users/me/``).
      properties:
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        locale:
          type: string
          minLength: 1
          maxLength: 35
        timezone:
          type: string
          minLength: 1
          title: Fuseau horaire (IANA)
          maxLength: 60
    RefreshRequest:
      type: object
      description: |-
        Renouvellement avec rotation : l'ancien refresh est blacklisté.

        Si le jeton porte le claim ``device_auth_id`` (flux device code), le client
        ne doit pas avoir été révoqué, sinon le renouvellement est refusé.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RegisterRequest:
      type: object
      description: 'Inscription : email unique (insensible à la casse) + mot de passe
        politique.'
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 10
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
    TokenPair:
      type: object
      description: Paire JWT (access + refresh).
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      description: Profil utilisateur (GET/PATCH ``/users/me/``).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Adresse email
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        is_active:
          type: boolean
          readOnly: true
          title: Actif
          description: Les comptes inactifs ne peuvent pas se connecter ni créer de
            compte.
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Date d'inscription
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Email vérifié le
        locale:
          type: string
          maxLength: 35
        timezone:
          type: string
          title: Fuseau horaire (IANA)
          maxLength: 60
      required:
      - date_joined
      - email
      - email_verified_at
      - id
      - is_active
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
