components:
  schemas:
    AccessGrant:
      type: object
      description: Autorisation de partage (vue côté sportif et côté coach bénéficiaire).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        athlete_id:
          type: string
          format: uuid
          title: Sportif
          readOnly: true
        granted_by_id:
          type: string
          format: uuid
          title: Accordé par
          readOnly: true
        grantee_type:
          allOf:
          - $ref: '#/components/schemas/GranteeTypeEnum'
          readOnly: true
          title: Type de bénéficiaire
        grantee_coach_id:
          type: string
          format: uuid
          readOnly: true
        grantee_team_id:
          type: string
          format: uuid
          readOnly: true
        scopes:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AccessGrantStatusEnum'
          readOnly: true
          title: Statut
        granted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Accordé le
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Révoqué le
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Expiration
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - athlete_id
      - created_at
      - expires_at
      - granted_at
      - granted_by_id
      - grantee_coach_id
      - grantee_team_id
      - grantee_type
      - id
      - revoked_at
      - scopes
      - status
    AccessGrantStatusEnum:
      enum:
      - pending
      - active
      - revoked
      - expired
      type: string
      description: |-
        * `pending` - En attente d'acceptation
        * `active` - Actif
        * `revoked` - Révoqué
        * `expired` - Expiré
    Annotation:
      type: object
      description: |-
        Lecture d'une annotation (tri par ``offset_ms``, puis ``created_at``).

        ``author`` n'est JAMAIS exposé (ni pk ni email) : l'accès à une annotation
        est l'accès à la séance ; l'auteur reste une donnée interne.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
          title: Type
        offset_ms:
          type: integer
          readOnly: true
          title: Décalage (ms)
        text:
          type: string
          readOnly: true
          title: Texte
        metadata:
          readOnly: true
          title: Métadonnées
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - metadata
      - offset_ms
      - text
    AthleteProfile:
      type: object
      description: Profil sportif ; ``email`` est uniquement renseigné pour le propriétaire.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          nullable: true
          readOnly: true
        date_of_birth:
          type: string
          format: date
          title: Date de naissance
        sex:
          title: Sexe
          oneOf:
          - $ref: '#/components/schemas/SexEnum'
          - $ref: '#/components/schemas/BlankEnum'
        height_cm:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Taille (cm)
        weight_kg:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Poids (kg)
        dominant_side:
          title: Côté dominant
          oneOf:
          - $ref: '#/components/schemas/DominantSideEnum'
          - $ref: '#/components/schemas/BlankEnum'
        sport:
          type: string
          title: Sport principal
          maxLength: 100
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date_of_birth
      - email
      - id
      - updated_at
    AthleteProfileRequest:
      type: object
      description: Profil sportif ; ``email`` est uniquement renseigné pour le propriétaire.
      properties:
        date_of_birth:
          type: string
          format: date
          title: Date de naissance
        sex:
          title: Sexe
          oneOf:
          - $ref: '#/components/schemas/SexEnum'
          - $ref: '#/components/schemas/BlankEnum'
        height_cm:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Taille (cm)
        weight_kg:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Poids (kg)
        dominant_side:
          title: Côté dominant
