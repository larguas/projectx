openapi: 3.0.3
info:
  title: API Plateforme EMG
  version: 1.0.0
  description: API de la plateforme de suivi musculaire et de performance sportive.
paths:
  /api/v1/access-grants/:
    get:
      operationId: access_grants_list
      description: |-
        Grants que j'ai accordés + (en tant que coach) grants qui me sont adressés.

        La création est réservée au propriétaire du profil sportif concerné et
        exige un email vérifié (``IsEmailVerified``, feature 02).
      parameters:
      - in: query
        name: grantee_type
        schema:
          type: string
          title: Type de bénéficiaire
          enum:
          - coach
          - team
        description: |-
          * `coach` - Coach
          * `team` - Équipe
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          title: Statut
          enum:
          - active
          - expired
          - pending
          - revoked
        description: |-
          * `pending` - En attente d'acceptation
          * `active` - Actif
          * `revoked` - Révoqué
          * `expired` - Expiré
      tags:
      - access-grants
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessGrantList'
          description: ''
        '400':
          description: Erreur de validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentification requise ou jeton invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès refusé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ressource introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflit avec l'état actuel de la ressource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: access_grants_create
      description: |-
        Grants que j'ai accordés + (en tant que coach) grants qui me sont adressés.

        La création est réservée au propriétaire du profil sportif concerné et
        exige un email vérifié (``IsEmailVerified``, feature 02).
      tags:
      - access-grants
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
          description: ''
        '400':
          description: Erreur de validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentification requise ou jeton invalide.
          content:
