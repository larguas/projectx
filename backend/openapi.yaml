      type: object
      description: |-
        Remplacement de la liste des canaux d'un setup (``PUT .../channels/``).

        ``channels`` est la liste COMPLÈTE : les canaux existants sont supprimés et
        les nouveaux créés atomiquement en service. Une liste vide est autorisée
        (setup sans canal déclaré). Les doublons ``(device, channel_id)`` sont
        refusés ici ; le niveau de détail effectif est recalculé ensuite en service
        (forcé à ``simple`` si aucun champ détaillé n'est renseigné).
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/SetupChannelInputRequest'
    SetupChannel:
      type: object
      description: |-
        Canal d'un setup (lecture) : muscle et capteur en références compactes.

        La photo est servie en URL relative via ``default_storage`` (jamais de
        bytes bruts dans la réponse).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device:
          allOf:
          - $ref: '#/components/schemas/DeviceReference'
          readOnly: true
        channel_id:
          type: integer
          readOnly: true
          title: Canal du capteur
        muscle:
          allOf:
          - $ref: '#/components/schemas/MuscleReference'
          readOnly: true
        side:
          allOf:
          - $ref: '#/components/schemas/SideEnum'
          readOnly: true
          title: Côté
        position_note:
          type: string
          readOnly: true
          title: Note de position
        inter_electrode_distance_mm:
          type: integer
          readOnly: true
          nullable: true
          title: Distance inter-électrodes (mm)
        skin_prep_done:
          type: boolean
          readOnly: true
          nullable: true
          title: Préparation cutanée faite
        photo:
          type: string
          nullable: true
          readOnly: true
      required:
      - channel_id
      - device
      - id
      - inter_electrode_distance_mm
      - muscle
      - photo
      - position_note
      - side
      - skin_prep_done
    SetupChannelInputRequest:
      type: object
      description: |-
        Une entrée du remplacement des canaux d'un setup.

        Tous les champs détaillés (``position_note``, ``inter_electrode_distance_mm``,
        ``skin_prep_done``, ``photo``) sont optionnels : un canal sans aucun champ
        détaillé est un canal « simple » (muscle + côté) — le niveau de détail du
        setup est recalculé en service après le remplacement.

        ``device`` est optionnel (canal déclaré sans capteur précis — placement
        générique) ; ``muscle`` référence TOUJOURS ``exercises.Muscle`` (jamais
        ``MuscleGroup``, décision feature 05).

        ``photo`` est limitée en type et en taille (JPEG/PNG/WebP, 5 Mo max —
        ``check_photo_limits``), validée sur l'upload AVANT écriture dans
        ``default_storage``.
      properties:
        device:
          type: string
          format: uuid
          nullable: true
        channel_id:
          type: integer
          minimum: 1
        muscle:
          type: string
          format: uuid
        side:
          allOf:
          - $ref: '#/components/schemas/SideEnum'
          default: na
        position_note:
          type: string
          default: ''
        inter_electrode_distance_mm:
          type: integer
          minimum: 1
          nullable: true
        skin_prep_done:
          type: boolean
          nullable: true
        photo:
          type: string
          format: binary
          nullable: true
      required:
      - channel_id
      - muscle
    SetupChannelReference:
      type: object
      description: Référence compacte d'un canal dans une calibration (muscle + côté).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel_id:
          type: integer
          readOnly: true
          title: Canal du capteur
        side:
          allOf:
          - $ref: '#/components/schemas/SideEnum'
          readOnly: true
          title: Côté
        muscle:
          allOf:
          - $ref: '#/components/schemas/MuscleReference'
          readOnly: true
      required:
