        exercise:
          allOf:
          - $ref: '#/components/schemas/SessionsExerciseReference'
          readOnly: true
        workout:
          allOf:
          - $ref: '#/components/schemas/SessionsWorkoutReference'
          readOnly: true
        status:
          allOf:
