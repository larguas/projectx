          type: string
    PlacementGuide:
      type: object
      description: |-
        Guide de placement d'un muscle (lecture) ; l'image est servie en URL
        relative via ``default_storage`` (jamais de bytes bruts).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        muscle:
          allOf:
          - $ref: '#/components/schemas/MuscleReference'
          readOnly: true
        title:
          type: string
          readOnly: true
          title: Titre
        instructions:
          type: string
          readOnly: true
        reference:
          type: string
          readOnly: true
          title: Référence
          description: Référence citée du guide (ex. recommandations SENIAM).
        image:
          type: string
          nullable: true
          readOnly: true
      required:
      - id
      - image
      - instructions
      - muscle
      - reference
      - title
    RefreshRequest:
      type: object
      description: |-
        Renouvellement avec rotation : l'ancien refresh est blacklisté.

        Si le jeton porte le claim ``device_auth_id`` (flux device code), le client
        ne doit pas avoir été révoqué, sinon le renouvellement est refusé.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RegisterRequest:
      type: object
      description: 'Inscription : email unique (insensible à la casse) + mot de passe
        politique.'
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 10
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
    ReplaceChannelsRequest:
      type: object
      description: |-
        Remplacement intégral des canaux (``PUT /sessions/{id}/channels/``).

        ``channels`` est la liste COMPLÈTE des canaux de la séance : le service les
        remplace atomiquement et re-dérive les appareils (premier appareil distinct
        = primaire). Uniquement pendant ``created`` (``locked``, 409).
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/SessionChannelInputRequest'
      required:
      - channels
    ReplaceDevicesRequest:
      type: object
      description: |-
        Remplacement intégral des rôles d'appareils (``PUT /sessions/{id}/devices/``).

        ``devices`` est la liste COMPLÈTE des appareils de la séance avec leur rôle :
        l'ensemble doit être exactement celui référencé par les canaux (l'ajout ou le
        retrait d'un appareil passe par ``PUT /channels/``) ; au plus un primaire.
        Uniquement pendant ``created`` (``locked``, 409).
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/SessionDeviceInputRequest'
      required:
      - devices
    ReplaceWorkoutExercisesRequest:
      type: object
      description: |-
        Remplacement de la liste ordonnée d'un plan (``PUT .../exercises/``).

        ``exercises`` est la liste COMPLÈTE des lignes, dans l'ordre souhaité :
        le service réindexe 1..N et remplace atomiquement les lignes existantes.
        Une liste vide est autorisée (plan sans exercice).
      properties:
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutExerciseInputRequest'
    SensorSetup:
      type: object
      description: |-
        Setup de placement (lecture) ; ``editable`` est calculé pour le courant.

        ``created_by`` n'est JAMAIS exposé (donnée d'audit — l'accès au setup est
        l'accès au sportif rattaché). ``is_used`` expose l'état figé (point
        d'extension unique de la feature 06) sans exposer le marqueur interne
        ``used_at``.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        athlete:
          allOf:
          - $ref: '#/components/schemas/SetupsAthleteReference'
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Nom
        version:
          type: integer
          readOnly: true
          default: 1
        parent:
          type: string
          format: uuid
          readOnly: true
        placement_inherited_from_parent:
          type: boolean
          readOnly: true
          title: Placement hérité de la version précédente
          description: 'True si cette version a été créée avec ``placement_unchanged=True``
            : le placement est physiquement identique à la version parente. Base du
            niveau ``identical`` du service de comparaison.'
        detail_level:
          allOf:
          - $ref: '#/components/schemas/DetailLevelEnum'
          readOnly: true
          title: Niveau de détail
        is_current:
          type: boolean
          readOnly: true
          title: Version courante
        is_used:
          type: boolean
          readOnly: true
        notes:
          type: string
          readOnly: true
        channels:
          type: array
          items:
            $ref: '#/components/schemas/SetupChannel'
          readOnly: true
        editable:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - athlete
      - channels
      - created_at
      - detail_level
      - editable
      - id
      - is_current
      - is_used
      - name
      - notes
      - parent
      - placement_inherited_from_parent
      - updated_at
      - version
    SessionChannel:
      type: object
