          readOnly: true
        protocol_version:
          type: integer
          readOnly: true
          title: Version du protocole
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Démarrée le
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Terminée le
        calibration_type:
          readOnly: true
          nullable: true
          title: Type de calibration
          description: |-
            Requis si ``session_type = calibration`` (mêmes valeurs que Calibration.type).

            * `mvc` - Contraction maximale volontaire
            * `rest_baseline` - Baseline au repos
