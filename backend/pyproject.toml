[project]
name = "emg-backend"
version = "0.1.0"
description = "Backend de la plateforme EMG — suivi musculaire et performance sportive"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "django>=5.2,<6.0",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "django-filter>=24.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "gunicorn>=22.0",
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "scipy>=1.13",
    "sentry-sdk[django]>=2.0",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
    "pytest-mock>=3.12",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["E402", "F401", "F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
addopts = "--reuse-db"
pythonpath = ["."]
testpaths = ["tests", "core", "apps"]

[tool.coverage.run]
source = ["config", "core", "apps"]
omit = [
    "*/migrations/*",
    "config/asgi.py",
    "config/wsgi.py",
    "manage.py",
]
